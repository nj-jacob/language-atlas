# Language pages are published as part of Atlas (ontario-math-atlas.web.app/language/), by the math-atlas repository.
# Every time main changes, this runs the automatic checks (tests/run.js). Only if they pass does it ask math-atlas
# to publish again; math-atlas then copies this repository's main into /language/ and publishes the whole site.
# Needs one repository secret, ATLAS_TOKEN (see SETUP.md).
name: Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  # The automatic checks run first. If any fail, nothing is published and the live site stays as it was.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the browser used by the checks
        working-directory: tests
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run the checks
        working-directory: tests
        run: npm test
  publish:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Ask math-atlas to publish Atlas with these Language pages
        env:
          TOKEN: ${{ secrets.ATLAS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::ATLAS_TOKEN secret is not set yet, so nothing was published."; exit 0; fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nj-jacob/math-atlas/dispatches \
            -d '{"event_type":"language-updated"}'
