# Publishes every pull request to its own private test link (a Firebase "preview channel"), so a change can be
# looked at on a phone before it goes live. It puts this pull request's Language pages under /language/ on a copy
# of the live Atlas site (math-atlas main). The link is posted on the pull request and stops working after 7 days.
# Only the website is copied there: the privacy rules are never changed, and the live site is not touched.
# The preview uses the real family database, so test with a test child, not a real child's account.
# Needs two secrets: ATLAS_TOKEN and FIREBASE_SERVICE_ACCOUNT (see SETUP.md).
name: Preview
on:
  pull_request:
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  preview:
    # Secrets are only available to pull requests from this repository, not from copies of it.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the publish key is set
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is not set yet, so there is no test link."; exit 0; fi
          echo "ready=yes" >> "$GITHUB_OUTPUT"
      - name: Get the live Atlas site
        if: steps.key.outputs.ready == 'yes'
        uses: actions/checkout@v4
        with:
          repository: nj-jacob/math-atlas
          token: ${{ secrets.ATLAS_TOKEN }}
      - name: Add this pull request's Language pages under /language/
        if: steps.key.outputs.ready == 'yes'
        uses: actions/checkout@v4
        with:
          path: language
      - if: steps.key.outputs.ready == 'yes'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ontario-math-atlas
          expires: 7d
